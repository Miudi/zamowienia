<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator Zamówień</title>

<style>
*{
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,sans-serif;
}

body{
    margin:0;
    background:#111;
    color:orange;
}

.logo{
    display:block;
    margin:0 auto 20px auto;
    max-width:250px;
    height:auto;
}
	
.container{
    width:95%;
    max-width:70%;
    margin:auto;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.wrapper{
    display:grid;
    grid-template-columns:minmax(450px, auto) minmax(500px, 1fr) minmax(450px, auto);
    gap:25px;
    align-items:start;
}

.info{
    background:#1b1b1b;
    border-radius:14px;
    padding:20px;
    position:sticky;
    top:20px;
}

.left,.right,.middle{
    background:#1b1b1b;
    border-radius:14px;
    padding:20px;
}

.right{
    position:sticky;
    top:20px;
}

input[type=text]{
    width:100%;
    padding:14px;
    background:#2b2b2b;
    border:none;
    color:white;
    border-radius:10px;
    font-size:17px;
}

#results{
    margin-top:15px;
    max-height:700px;
    overflow:auto;
}

.product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    margin-bottom:8px;
    border-radius:8px;
    background:#252525;
}

.product:hover{
    background:#313131;
}

.product button{
    background:#3fa34d;
    border:none;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.product button:hover{
    background:#4bc75b;
}

.cartItem{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:10px;
    align-items:center;
    background:#252525;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
}

.qty{
    display:flex;
    align-items:center;
}

.qty button{
    width:30px;
    height:30px;
    border:none;
    background:#444;
    color:white;
    cursor:pointer;
    border-radius:5px;
    font-size:18px;
}

.qty input{
    width:50px;
    text-align:center;
    margin:0 5px;
    background:#111;
    color:white;
    border:1px solid #555;
    border-radius:5px;
    height:30px;
}

.remove{
    background:#d43b3b;
    border:none;
    color:white;
    padding:8px;
    border-radius:7px;
    cursor:pointer;
}

.remove:hover{
    background:#ff5555;
}

.price{
    color:#7fff95;
    font-weight:bold;
    margin-top:4px;
}

.total{
    margin-top:20px;
    font-size:25px;
    text-align:right;
    color:#7fff95;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.actions button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.copy{
    background:#3a7cff;
    color:white;
}

.clear{
    background:#555;
    color:white;
}

.searchBox{
    display:flex;
    align-items:center;
    background:#242424;
    border-radius:14px;
    padding:0 16px;
    border:2px solid transparent;
    transition:.25s;
}

.searchBox:focus-within{
    border-color:#43b581;
    box-shadow:0 0 0 4px rgba(67,181,129,.18);
}

.searchIcon{
    font-size:20px;
    color:#9b9b9b;
    margin-right:12px;
}

.searchBox input{
    flex:1;
    border:none;
    background:transparent;
    color:white;
    padding:16px 0;
    font-size:17px;
    outline:none;
}

.searchBox input::placeholder{
    color:#8a8a8a;
}

.companySelect{
    width:100%;
    padding:12px;
    background:#2b2b2b;
    color:white;
    border:1px solid #555;
    border-radius:8px;
    font-size:16px;
    margin-bottom:15px;
}

</style>
</head>
<body>

<div class="container">

<img src="logo_firmy.png" class="logo" alt="Logo firmy">

<h1>🛒 Generator Zamówień</h1>

<div class="wrapper">

<div class="left">

<h2 style="text-align:center">Dane Firmy</h2>

<label for="company" style="display:block;margin-bottom:8px;">
    Firma:
</label>

<select id="company" class="companySelect">
    <option value=""></option>
    <option value="The Town">The Town</option>
    <option value="Yellow Jack">Yellow Jack</option>
    <option value="The Paddock">The Paddock</option>
    <option value="Jose Café">Jose Café</option>
    <option value="77 Club">7 Club</option>
</select>


	
<label for="employee" style="display:block;margin-bottom:8px;">
    Osoba Zamawiająca:
</label>

<input
    type="text"
    id="employee"
    class="companySelect"
    placeholder="Wpisz imię i nazwisko">

<br><br>

<script>
	const company = document.getElementById("company");
	const employee = document.getElementById("employee");
	
	// Wczytaj zapisaną firmę
	const savedCompany = localStorage.getItem("company");
	if (savedCompany) {
	    company.value = savedCompany;
	}
	
	// Wczytaj zapisaną osobę
	const savedEmployee = localStorage.getItem("employee");
	if (savedEmployee) {
	    employee.value = savedEmployee;
	}
	
	// Zapisuj po zmianie firmy
	company.addEventListener("change", () => {
	    localStorage.setItem("company", company.value);
	});
	
	// Zapisuj podczas wpisywania osoby
	employee.addEventListener("input", () => {
	    localStorage.setItem("employee", employee.value);
	});

// Zapisuj po zmianie
company.addEventListener("change", () => {
    localStorage.setItem("company", company.value);
});
</script>

</div>

<div class="middle">

<div class="searchBox">
    <span class="searchIcon">🔍</span>
    <input id="search" type="text" placeholder="Wyszukaj produkt...">
</div>

<div id="results"></div>

</div>

<div class="right">

<h2 style="text-align:center">Zamówienie</h2>

<div id="cart"></div>

<div class="total">
Razem: $<span id="sum">0</span>
</div>

<div class="actions">
<button class="copy" onclick="copyOrder()">📋 Kopiuj</button>
<button class="clear" onclick="clearCart()">🗑️ Wyczyść</button>
</div>

</div>

</div>

</div>

<script>

const products=[

["Sos Barbeque",8],["Sos Serowy",8],["Sos Chilli",8],["Sos Sojowy",8],["Sos Ketchup",8],["Sos Majonez",8],["Musztarda",8],["Sos Salsa",8],["Sos Teriyaki",8],["Sos Pomidorowy",8],["Sos Tzatziki",8],["Sos Śmietankowy",8],

["E-cola",6],["Woda gazowana",6],["Woda niegazowana",6],["Energetyk junk",6],["Orange-O-Tang",6],["Puszka sprunk",6],["Tonic",6],["Paczka ziaren kawy",15],["Kostki lodu",6],

["Dżem jabłkowy",6],["Dżem winogronowy",6],

["Zioła",11],["Przyprawy",6],["Tabasco",7],

["Ciastko",8],["Sos Owocowy",8],["Sos Czekoladowy",8],["Syrop owocowy",6],["Miód",8],["Cukier",5],

["Pieczywo",8],["Mąka",6],["Panierka",6],["Tortilla",7],["Makaron",5],

["Rak amerykański",15],["Małża",9],["Owoce morza",11],["Krewetka",10],

["Nori do sushi",5],["Ryż",5],

["Banan",12],["Borówka",12],["Cytryna",12],["Dziki agrest",12],["Jabłko",12],["Jagoda amerykańska",12],["Jeżyna",12],["Kiść winogron",12],["Limonka",12],["Malina",12],["Pomarańcze",12],["Poziomka",12],["Cytrusy",18],["Owoce",18],

["Baranina",20],["Mięso z indyka",20],["Wołowina",26],["Kiełbasa",20],["Wieprzowina",26],["Mięso z kaczki",20],["Mięso z kurczaka",20],["Żeberka",26],["Karp",38],["Makrela pacyficzna",18],["Pstrąg potokowy",18],["Sardynka pacyficzna",18],["Śledź pacyficzny",18],["Łosoś królewski",32],["Sum pospolity",32],

["Cebula",10],["Papryka",10],["Ziemniaki",11],["Bita śmietana",13],["Jogurt",13],["Mleko",11],["Masło",12],["Śmietana",10],["Boczniak ostrygowaty",11],["Borowik królewski",11],["Kurka złocista",11],["Maślak",11],["Opieńka miodowa",11],["Rydz amerykański",11],["Smardz leśny",11],["Jajko",10],["Warzywa",15],["Mięta",10],

["Paczka liści herbaty",15],

["Olej",7],["Orzeszki ziemne",7],["Zupa",8]

];

const cart={};

const results=document.getElementById("results");
const cartDiv=document.getElementById("cart");

function renderProducts(filter=""){

results.innerHTML="";

products
.filter(p=>p[0].toLowerCase().includes(filter.toLowerCase()))
.sort((a,b)=>a[0].localeCompare(b[0]))
.forEach(p=>{

results.innerHTML+=`
<div class="product">
<div>
<b>${p[0]}</b><br>
<span style="color:#7fff95">$${p[1]}</span>
</div>
<button onclick="addProduct('${p[0]}',${p[1]})">Dodaj</button>
</div>
`;

});

}

function addProduct(name,price){

if(cart[name]){

cart[name].qty++;

}else{

cart[name]={price,qty:1};

}

renderCart();

}

function renderCart(){

cartDiv.innerHTML="";

let total=0;

for(let name in cart){

let item=cart[name];

let value=item.price*item.qty;

total+=value;

cartDiv.innerHTML+=`

<div class="cartItem">

<div>
<b>${name}</b>
<div class="price">$${value}</div>
</div>

<div class="qty">
<button onclick="changeQty('${name}',-1)">-</button>
<input value="${item.qty}" onchange="setQty('${name}',this.value)">
<button onclick="changeQty('${name}',1)">+</button>
</div>

<button class="remove" onclick="removeItem('${name}')">🗑️</button>

</div>

`;

}

document.getElementById("sum").innerText=total;

}

function changeQty(name,d){

cart[name].qty+=d;

if(cart[name].qty<=0)
delete cart[name];

renderCart();

}

function setQty(name,val){

val=parseInt(val);

if(isNaN(val)||val<=0){

delete cart[name];

}else{

cart[name].qty=val;

}

renderCart();

}

function removeItem(name){

delete cart[name];

renderCart();

}

function clearCart(){

for(let k in cart)
delete cart[k];

renderCart();

}

function copyOrder(){

    const company = document.getElementById("company").value.trim();
    const employee = document.getElementById("employee").value.trim();

    if(company === ""){
        alert("Wybierz firmę!");
        return;
    }

    if(employee === ""){
        alert("Podaj osobę zamawiającą!");
        return;
    }

    if(Object.keys(cart).length === 0){
        alert("Dodaj przynajmniej jeden produkt do zamówienia!");
        return;
    }

    let txt = "```\n";

    txt += `Firma: ${company}\n`;
    txt += `Osoba: ${employee}\n`;
    txt += `Typ produktu\n`;

    for(let name in cart){
        txt += `${name} ${cart[name].qty}\n`;
    }

    txt += "```";

    navigator.clipboard.writeText(txt);

    alert("Skopiowano listę produktów!");
}

document.getElementById("search").addEventListener("input",e=>renderProducts(e.target.value));

renderProducts();

</script>

</body>
</html>
