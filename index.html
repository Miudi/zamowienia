<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><b>Generator Zamówień</b></title>
	<link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <img src="logo_firmy.png" class="logo" alt="Logo firmy">
      <h1>🛒 Generator Zamówień</h1>
      <div class="wrapper">
        <div class="left">
          <h2 style="text-align:center">Dane Firmy</h2>
          <label for="company" style="display:block;margin-bottom:8px;"> Firma: </label>
          <select id="company" class="companySelect">














			  







			  
            <option value=""></option>
            <option value="The Town">The Town</option>
            <option value="Yellow Jack">Yellow Jack</option>
            <option value="The Paddock">The Paddock</option>
            <option value="Jose Café">Jose Café</option>
            <option value="77 Club">77 Club</option>
            <option value="Bahama Mamas">Bahama Mamas</option>
            <option value="Kebab King">Kebab King</option>
			<option value="Tropical Night Club">Tropical Night Club</option>
			<option value="The Four Dragons">The Four Dragons</option>

























			  
          </select>
          <label for="employee" style="display:block;margin-bottom:8px;"> Osoba Zamawiająca: </label>
          <input type="text" id="employee" class="companySelect" placeholder="Wpisz imię i nazwisko">
          <br>
          <br>
        </div>
        <div class="middle">
          <div class="searchBox">
            <span class="searchIcon">🔍</span>
            <input id="search" type="text" placeholder="Wyszukaj produkt...">
          </div>
          <div class="filterBar">
            <label class="filterCheckboxLabel">
              <input type="checkbox" id="onlyFavorites">
              <span class="customSwitch"></span>
              <span>Pokaż tylko ulubione <span class="heartIcon">♥</span>
              </span>
            </label>
          </div>
          <div id="results"></div>
        </div>
        <div class="right">
          <h2 style="text-align:center">Zamówienie</h2>
          <div id="cart"></div>
          <div class="total"> Razem: $ <span id="sum">0</span>
          </div>
          <div class="actions">
            <button class="copy" onclick="copyOrder()">📋 Kopiuj</button>
            <button class="clear" onclick="clearCart()">🗑️ Wyczyść</button>
          </div>
        </div>
      </div>
    </div>

  <script src="script.js"></script>
  </body>
</html>
